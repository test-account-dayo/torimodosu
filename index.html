function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}

/* ================= AUDIO ================= */
const A={ctx:null,master:null,music:null,sfx:null,muted:lsGet('rmw-mute')==='1',cur:null,curName:null,timer:null,noise:null,want:null};
function initAudio(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{A.ctx=new C()}catch(e){return}
  A.master=A.ctx.createGain();A.master.gain.value=A.muted?0:0.55;A.master.connect(A.ctx.destination);
  A.music=A.ctx.createGain();A.music.gain.value=0.55;A.music.connect(A.master);
  A.sfx=A.ctx.createGain();A.sfx.gain.value=0.8;A.sfx.connect(A.master);
  const len=A.ctx.sampleRate*0.5,buf=A.ctx.createBuffer(1,len,A.ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1; A.noise=buf;
  const s=A.ctx.createBufferSource();s.buffer=A.ctx.createBuffer(1,1,22050);s.connect(A.ctx.destination);s.start(0);
  if(A.want){const w=A.want;A.want=null;playSong(w)}
}
function setMute(m){A.muted=m;lsSet('rmw-mute',m?'1':'0');if(A.master)A.master.gain.value=m?0:0.55;$('#btnMute').textContent=m?'♪ OFF':'♪ おと'}
const NI={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nfreq(n){const m=n.match(/^([A-G]#?)(\d)$/);return 440*Math.pow(2,(12*(+m[2]+1)+NI[m[1]]-69)/12)}
function parseTrack(s){return s.trim().split(/\s+/).map(t=>{const[n,l]=t.split(':');return{n:n==='-'?null:n,l:l?+l:2}})}
function tone(type,f,t,d,vol,dest,slide){
  const o=A.ctx.createOscillator(),gn=A.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(vol,t+0.008);
  gn.gain.setValueAtTime(vol,t+Math.max(0.01,d*0.6));gn.gain.linearRampToValueAtTime(0.0001,t+d);
  o.connect(gn).connect(dest||A.sfx);o.start(t);o.stop(t+d+0.03);
}
function noise(t,d,vol,freq,type,to){
  const s=A.ctx.createBufferSource();s.buffer=A.noise;const f=A.ctx.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq,t);
  if(to)f.frequency.exponentialRampToValueAtTime(to,t+d);const gn=A.ctx.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+d);
  s.connect(f).connect(gn).connect(A.sfx);s.start(t);s.stop(t+d+0.02);
}

function playSong(name,opt={}){
  if(!A.ctx){if(!SONGS[name].once)A.want=name;return}
  if(A.curName===name&&!opt.force)return;
  stopSong();
  const song=SONGS[name];const spb=60/song.bpm/4;const t0=A.ctx.currentTime+0.06;
  A.curName=name;A.cur={song,spb,onEnd:opt.onEnd,tracks:song.tracks.map(t=>({wave:t.wave,vol:t.vol,notes:parseTrack(t.notes),i:0,time:t0,ended:false}))};
  A.timer=setInterval(schedule,25);schedule();
}
function schedule(){
  const c=A.cur;if(!c)return;const now=A.ctx.currentTime;let all=true;
  for(const tr of c.tracks){
    while(!tr.ended&&tr.time<now+0.15){
      if(tr.i>=tr.notes.length){if(c.song.once){tr.ended=true;break}tr.i=0}
      const nt=tr.notes[tr.i++];const d=nt.l*c.spb;
      if(nt.n)tone(tr.wave,nfreq(nt.n),tr.time,d*0.92,tr.vol,A.music);
      tr.time+=d;
    }
    if(!tr.ended)all=false;
  }
  if(c.song.once&&all){const end=Math.max(...c.tracks.map(t=>t.time));if(now>=end){const cb=c.onEnd;stopSong();cb&&cb()}}
}
function stopSong(){clearInterval(A.timer);A.timer=null;A.cur=null;A.curName=null}
function jingle(name){return new Promise(res=>{if(!A.ctx)return res();playSong(name,{force:true,onEnd:res});setTimeout(res,4000)})}
function sfx(n){
  if(!A.ctx)return;const t=A.ctx.currentTime;
  switch(n){
  case'cur':tone('square',1250,t,0.03,0.04);break;
  case'ok':tone('square',880,t,0.045,0.05);tone('square',1320,t+0.045,0.06,0.05);break;
  case'cancel':tone('square',620,t,0.045,0.05);tone('square',420,t+0.045,0.06,0.05);break;
  case'buzz':tone('square',150,t,0.14,0.07);break;
  case'bump':tone('triangle',95,t,0.07,0.3);break;
  case'hit':noise(t,0.13,0.35,2400,'lowpass',500);tone('square',220,t,0.07,0.05,null,90);break;
  case'crit':noise(t,0.28,0.45,3500,'lowpass',400);tone('square',440,t,0.12,0.06,null,110);break;
  case'ehit':noise(t,0.18,0.4,900,'lowpass',200);tone('triangle',120,t,0.15,0.3,null,60);break;
  case'down':noise(t,0.35,0.3,1800,'bandpass',200);break;
  case'fire':noise(t,0.5,0.35,500,'bandpass',3000);break;
  case'earth':noise(t,0.55,0.5,300,'lowpass',80);tone('triangle',80,t,0.4,0.35,null,40);break;
  case'wind':noise(t,0.55,0.3,1200,'highpass',5000);break;
  case'heal':[523,659,784,1047,1319].forEach((f,i)=>tone('sine',f,t+i*0.055,0.14,0.12));break;
  case'buff':[392,523,659,784].forEach((f,i)=>tone('square',f,t+i*0.05,0.08,0.04));break;
  case'summon':[330,415,494,659,831].forEach((f,i)=>tone('triangle',f,t+i*0.045,0.12,0.18));break;
  case'chest':[784,988,1175,1568].forEach((f,i)=>tone('square',f,t+i*0.07,0.09,0.05));break;
  case'enc':for(let i=0;i<8;i++)tone('square',260+i*110,t+i*0.035,0.04,0.05);break;
  case'run':for(let i=0;i<6;i++)tone('square',1000-i*130,t+i*0.04,0.04,0.04);break;
  case'warp':for(let i=0;i<10;i++)tone('triangle',300+i*90,t+i*0.04,0.06,0.18);break;
  case'buy':tone('square',988,t,0.05,0.05);tone('square',1319,t+0.05,0.16,0.05);break;
  case'poison':tone('square',300,t,0.2,0.04,null,150);break;
  case'sleep':tone('sine',600,t,0.3,0.12,null,300);tone('sine',500,t+0.3,0.3,0.12,null,250);break;
  case'clone':[523,784,1047,1568].forEach((f,i)=>tone('sine',f,t+i*0.08,0.2,0.1));break;
  case'scan':for(let i=0;i<4;i++)tone('square',1500,t+i*0.09,0.04,0.04);break;
  case'bridge':for(let i=0;i<5;i++)tone('triangle',200+i*60,t+i*0.07,0.07,0.3);break;
  }

/* ================= PIXEL ART ================= */
const OUT='#2a1f3d';
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return[c,g]}
class Pix{
  constructor(w,h){[this.c,this.g]=mk(w,h);this.w=w;this.h=h}
  px(x,y,c){this.g.fillStyle=c;this.g.fillRect(x|0,y|0,1,1)}
  rect(x,y,w,h,c){this.g.fillStyle=c;this.g.fillRect(x,y,w,h)}
  ell(cx,cy,rx,ry,c){this.g.fillStyle=c;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)this.g.fillRect(x,y,1,1)}}
  ellF(cx,cy,rx,ry,fn){for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1){const c=fn(x,y);if(c){this.g.fillStyle=c;this.g.fillRect(x,y,1,1)}}}}
  clr(x,y,w,h){this.g.clearRect(x,y,w,h)}
  tri(cx,top,h,half,c){for(let y=0;y<h;y++){const w=Math.round(half*(y+1)/h);this.rect(cx-w,top+y,2*w+1,1,c)}}
  line(x0,y0,x1,y1,c){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)this.px(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c)}
  map(rows,pal){rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const ch=r[x];if(ch!=='.'&&pal[ch])this.px(x,y,pal[ch])}})}
  outline(col=OUT){const{w,h}=this;const d=this.g.getImageData(0,0,w,h).data;const o=[];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>40)continue;let n=false;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h)continue;if(d[(Y*w+X)*4+3]>40){n=true;break}}if(n)o.push(x,y)}
    this.g.fillStyle=col;for(let i=0;i<o.length;i+=2)this.g.fillRect(o[i],o[i+1],1,1);return this}
}
function flipH(c){const[o,g]=mk(c.width,c.height);g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o}
function silhouette(c,col){const[o,g]=mk(c.width,c.height);g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return o}

function grassBase(p,c1='#8fe05e',c2='#72c847'){p.rect(0,0,16,16,c1);for(const[x,y]of[[2,3],[9,2],[12,8],[5,10],[11,13],[1,14]]){p.px(x,y,c2);p.px(x+1,y-1,c2);p.px(x+2,y,c2)}}
function flower(p,x,y,c,m='#ffd43b'){p.px(x-1,y,c);p.px(x+1,y,c);p.px(x,y-1,c);p.px(x,y+1,c);p.px(x,y,m)}

function genField(){
  const W=44,H=34,r=rng(2024);const g=[...Array(H)].map(()=>Array(W).fill('.'));
  const inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H,set=(x,y,c)=>{if(inb(x,y))g[y][x]=c};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.min(x,y,W-1-x,H-1-y);if(d<2||(d===2&&r()<0.45)||(d===3&&r()<0.12))g[y][x]='M'}
  for(const[x,y]of[[14,4],[15,4],[16,4],[15,5],[16,5],[17,5],[17,4],[30,5],[31,5],[31,6],[8,28],[9,28],[9,29]])set(x,y,'M');
  for(let i=0;i<30;i++){const cx=3+Math.floor(r()*(W-6)),cy=3+Math.floor(r()*(H-6)),rad=1+r()*2.3;
    for(let y=Math.floor(cy-rad);y<=cy+rad;y++)for(let x=Math.floor(cx-rad);x<=cx+rad;x++)if(inb(x,y)&&g[y][x]==='.'&&(x-cx)**2+(y-cy)**2<=rad*rad&&r()<0.85)g[y][x]='T'}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]==='.'&&r()<0.06)g[y][x]=',';
  for(let y=0;y<H;y++){const x=riverX(y);set(x,y,'~');set(x+1,y,'~')}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(((x-37)/5.2)**2+((y-27)/4.2)**2<=1)g[y][x]='~';if((x-37)**2+(y-27)**2<=2.3)g[y][x]='.'}
  g[27][37]='C';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=Math.hypot(x-35,y-9);if(d>=1.2&&d<=3.3&&y<=9)set(x,y,'T')}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(Math.hypot(x-10,y-22)<=2.2)g[y][x]='.';
  set(10,22,'H');
  for(let x=11;x<riverX(22);x++)set(x,22,':');
  for(let x=riverX(22)+2;x<=35;x++)set(x,22,':');
  for(let y=10;y<=22;y++)set(35,y,':');
  set(35,9,'F');
  for(const[,cx,cy]of FIELD_CHESTS)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=cx+dx,y=cy+dy;if(inb(x,y)&&(g[y][x]==='T'||g[y][x]==='M'))g[y][x]='.'}
  // だい２わ：みなみの トンネル
  for(let y=23;y<=31;y++)set(10,y,':');for(const[x,y]of[[9,30],[11,30],[9,31],[11,31]])set(x,y,'.');set(10,32,'U');
  return g.map(r=>r.join(''));
}

  return g.map(r=>r.join(''));

function genCave(){
  const W=29,H=26,oy=5,CW=14,CH=10,r=rng(99);const g=[...Array(H)].map(()=>Array(W).fill('R'));
  const cell=(i,j)=>[2*i+1,oy+2*j+1];const vis=new Set(['7,9']);const stk=[[7,9]];{const[x,y]=cell(7,9);g[y][x]='.'}
  while(stk.length){const[i,j]=stk[stk.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[i+a,j+b]).filter(([a,b])=>a>=0&&b>=0&&a<CW&&b<CH&&!vis.has(a+','+b));
    if(!nb.length){stk.pop();continue}const[a,b]=nb[Math.floor(r()*nb.length)];vis.add(a+','+b);const[x1,y1]=cell(i,j),[x2,y2]=cell(a,b);g[y2][x2]='.';g[(y1+y2)/2][(x1+x2)/2]='.';stk.push([a,b])}
  let k=0,guard=0;while(k<26&&guard++<600){const i=Math.floor(r()*CW),j=Math.floor(r()*CH);const d=r()<0.5?[1,0]:[0,1];const a=i+d[0],b=j+d[1];if(a>=CW||b>=CH)continue;const[x1,y1]=cell(i,j),[x2,y2]=cell(a,b);const wx=(x1+x2)/2,wy=(y1+y2)/2;if(g[wy][wx]==='R'){g[wy][wx]='.';k++}}
  for(let y=1;y<=3;y++)for(let x=11;x<=19;x++)g[y][x]='.';g[4][15]='.';g[5][15]='.';g[25][15]='E';
  const dist={};const q=[[15,24]];dist['15,24']=0;
  while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=W||Y>=H||g[Y][X]==='R'||dist[X+','+Y]!=null)continue;dist[X+','+Y]=dist[x+','+y]+1;q.push([X,Y])}}
  const dead=[];for(let y=oy;y<H-1;y++)for(let x=0;x<W;x++){if(g[y][x]!=='.')continue;let n=0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(g[y+dy]&&g[y+dy][x+dx]&&g[y+dy][x+dx]!=='R')n++;if(n===1&&!(x===15&&y===24))dead.push([x,y,dist[x+','+y]||0])}
  dead.sort((a,b)=>b[2]-a[2]);const chests=[];for(const d of dead){if(chests.length>=4)break;if(chests.some(c=>Math.abs(c[0]-d[0])+Math.abs(c[1]-d[1])<7))continue;chests.push(d)}
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(g[y][x]!=='R')continue;let fl=false;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(g[y+dy][x+dx]==='.')fl=true;if(fl&&r()<0.16)g[y][x]='L'}
  for(const[x,y]of[[11,1],[19,1],[11,3],[19,3]])g[y][x]='L';
  for(let y=oy;y<H-1;y++)for(let x=0;x<W;x++){if(g[y][x]!=='.'||chests.some(c=>c[0]===x&&c[1]===y))continue;if(r()<0.08)g[y][x]=','}
  return{rows:g.map(r=>r.join('')),chests};
}

function tryMove(d){
  const m=MAPS[S.map];if(P.dir!==d){P.dir=d;lastBump=''}
  const[dx,dy]=DIRV[d];const nx=P.x+dx,ny=P.y+dy;
  if(S.fly){if(nx<1||ny<1||nx>=m.w-1||ny>=m.h-1)return;startMove(nx,ny);return}
  if(!passable(m,nx,ny)||objAt(nx,ny)){const key=nx+','+ny+','+d;if(key!==lastBump){lastBump=key;sfx('bump');onBump(nx,ny,d)}return}
  startMove(nx,ny);

function startMove(nx,ny){
  P.fx=P.x;P.fy=P.y;let ax=P.x,ay=P.y;P.x=nx;P.y=ny;
  for(const f of FOL){f.fx=f.x;f.fy=f.y;f.moved=false;const ox=f.x,oy=f.y;
    if(!(f.x===ax&&f.y===ay)){const dx=ax-f.x,dy=ay-f.y;f.dir=dx>0?'right':dx<0?'left':dy>0?'down':'up';f.x=ax;f.y=ay;f.moved=true}
    ax=ox;ay=oy}
  P.moving=true;P.t=0;P.dur=S.fly?95:150;P.step^=1;lastBump='';
}
function updateMap(dt){
  if(P.moving){P.t+=dt;const k=Math.min(1,P.t/P.dur);P.px=(P.fx+(P.x-P.fx)*k)*16;P.py=(P.fy+(P.y-P.fy)*k)*16;
    for(const f of FOL)if(f.moved){f.px=(f.fx+(f.x-f.fx)*k)*16;f.py=(f.fy+(f.y-f.fy)*k)*16}
    if(k>=1){P.moving=false;for(const f of FOL){f.px=f.x*16;f.py=f.y*16}onStepDone();if(!P.moving&&canControl()){const d=heldDir();if(d)tryMove(d)}}}
  else if(canControl()){const d=heldDir();if(d)tryMove(d)}
  // npcs
  const m=MAPS[S.map];
  for(const o of objs()){if(o.type!=='npc')continue;
    if(o.moving){o.t+=dt;const k=Math.min(1,o.t/260);o.px=(o.fx+(o.x-o.fx)*k)*16;o.py=(o.fy+(o.y-o.fy)*k)*16;if(k>=1)o.moving=false;continue}
    if(!o.wander||!canControl())continue;o.mt-=dt;if(o.mt>0)continue;o.mt=R(900,2600);
    const d=pick(['up','down','left','right']);const[dx,dy]=DIRV[d];const nx=o.x+dx,ny=o.y+dy;o.dir=d;
    if(Math.abs(nx-o.home[0])>o.wander||Math.abs(ny-o.home[1])>o.wander)continue;
    if(!passable(m,nx,ny)||objAt(nx,ny)||(nx===P.x&&ny===P.y)||FOL.some(f=>f.x===nx&&f.y===ny)||tileName(m,nx,ny)==='floor')continue;
    o.fx=o.x;o.fy=o.y;o.x=nx;o.y=ny;o.moving=true;o.t=0;
  }
}
function onStepDone(){
  const m=MAPS[S.map],c=chOf(m,P.x,P.y),ex=EXITS[S.map];
  if(ex&&(ex.ch?c===ex.ch:ex.test(P.x,P.y)))return runScript(async()=>{await gotoMap(...ex.to,false)});
  if(m.over&&!S.fly){const en=ENTR[S.map][c];if(en)return runScript(()=>enterPlace(en))}
  if(!S.fly){const e=encFor();if(e&&--encSteps<=0){resetEnc();return runScript(()=>battle(pick(e[0]),{bg:e[1]}))}}
}
function onBump(x,y,d){
  const m=MAPS[S.map],n=tileName(m,x,y);
  if(m.over&&n==='water')runScript(()=>bridgeAsk(x,y,d));
  else if(n==='castle')runScript(castleBump);

    if(h.st.sleep){acts.push({type:'asleep',who:i});k++;continue}

    if(a==='back'){k--;while(k>=0&&S.party[able[k]].st.sleep){k--;acts.pop()}acts.pop();if(k<0)k=0;continue}
    acts.push(a);if(a.type==='run')break;k++;
  }

    if(e.d.double&&e.hp<=e.max*e.d.double){if(!e.angry){e.angry=1;sfx('earth');B.shake=8;await say(`${e.name}は おこった！\nこうげきが 2かいに なった！`,{pos:'top',auto:1400,speed:16})}acts.push({type:'enemy',e})}}
  for(const a of acts){const s=a.type==='enemy'?a.e.spd:heroSpd(S.party[a.who]);a.ord=(a.type==='defend'?999:0)+s*(0.75+Math.random()*0.5)}
  acts.sort((a,b)=>b.ord-a.ord);
